<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>VHF Radio Intercom</title>
  <style>
    body {
      background: #121212;
      color: #fff;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .radio-panel {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 24px;
      width: 280px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .display {
      background: #0a1908;
      color: #33ff33;
      font-size: 32px;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid #1c4d18;
      text-shadow: 0 0 8px rgba(51, 255, 51, 0.6);
    }
    .status {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 20px;
      height: 16px;
    }
    .ptt-btn {
      background: #c0392b;
      color: white;
      border: none;
      padding: 20px;
      border-radius: 50%;
      width: 100px;
      height: 100px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 0 #7b241c;
      transition: all 0.1s;
    }
    .ptt-btn:active, .ptt-btn.active {
      background: #e74c3c;
      transform: translateY(4px);
      box-shadow: 0 0 0 #7b241c;
    }
  </style>
</head>
<body>

<div class="radio-panel">
  <div class="display" id="freq">122.800</div>
  <div class="status" id="status">RADIO STANDBY</div>
  <button class="ptt-btn" id="pttBtn">PUSH TO TALK</button>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let isTransmitting = false;

  const pttBtn = document.getElementById('pttBtn');
  const status = document.getElementById('status');

  // Efekt kliknięcia gruszki (Mic Click / Bleep)
  function playRadioClick(freqHz = 800) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freqHz, ctx.currentTime);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }

  // Rozpoczęcie nadawania
  async function startTX() {
    if (isTransmitting) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      isTransmitting = true;
      status.innerText = "TX (NADAWANIE...)";
      status.style.color = "#ff3333";
      pttBtn.classList.add('active');
      
      playRadioClick(1000); // Dźwięk włączenia nadawania

      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.start();
    } catch (err) {
      status.innerText = "BRAK DOSTĘPU DO MIKROFONU";
    }
  }

  // Zakończenie nadawania
  function stopTX() {
    if (!isTransmitting) return;
    isTransmitting = false;
    status.innerText = "RADIO STANDBY";
    status.style.color = "#aaa";
    pttBtn.classList.remove('active');

    playRadioClick(600); // Dźwięk puszczenia przycisku

    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
    }
  }

  // Obsługa przycisku (mysz)
  pttBtn.addEventListener('mousedown', startTX);
  pttBtn.addEventListener('mouseup', stopTX);
  pttBtn.addEventListener('mouseleave', stopTX);

  // Obsługa spacji na klawiaturze
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) startTX();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') stopTX();
  });
</script>

</body>
</html>
