<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>VHF Radio Intercom - CometJet EFB</title>
  <!-- Biblioteka PeerJS do przesyłania głosu między urządzeniami -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      background: #121212;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .radio-panel {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 24px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .freq-input-group {
      margin-bottom: 15px;
    }
    .freq-input {
      background: #0a1908;
      color: #33ff33;
      font-size: 28px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #1c4d18;
      text-shadow: 0 0 8px rgba(51, 255, 51, 0.6);
      width: 180px;
      text-align: center;
      font-family: inherit;
    }
    .connect-btn {
      background: #2980b9;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }
    .status {
      font-size: 12px;
      color: #aaa;
      margin: 15px 0;
      height: 16px;
      font-weight: bold;
    }
    .ptt-btn {
      background: #c0392b;
      color: white;
      border: none;
      padding: 20px;
      border-radius: 50%;
      width: 110px;
      height: 110px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 0 #7b241c;
      transition: all 0.1s;
    }
    .ptt-btn:active, .ptt-btn.active {
      background: #e74c3c;
      transform: translateY(4px);
      box-shadow: 0 0 0 #7b241c;
    }
    .ptt-btn:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="radio-panel">
  <div class="freq-input-group">
    <label style="display:block; font-size:12px; color:#888; margin-bottom:5px;">CZESTOTLIWOSC (KANAL):</label>
    <input type="text" id="freq" class="freq-input" value="122800" maxlength="6">
    <br>
    <button class="connect-btn" id="connectBtn" onclick="initRadio()">POLACZ RADIO</button>
  </div>
  
  <div class="status" id="status">OFFLINE - WPISZ CZESTOTLIWOSC</div>
  
  <button class="ptt-btn" id="pttBtn" disabled>PUSH TO TALK</button>
  
  <!-- Ukryty odtwarzacz audio dla głosu drugiego pilota -->
  <audio id="remoteAudio" autoplay></audio>
</div>

<script>
  let peer = null;
  let localStream = null;
  let currentCall = null;
  let isTransmitting = false;

  const pttBtn = document.getElementById('pttBtn');
  const status = document.getElementById('status');
  const freqInput = document.getElementById('freq');
  const connectBtn = document.getElementById('connectBtn');
  const remoteAudio = document.getElementById('remoteAudio');

  // Efekt dźwiękowy włączenia/wyłączenia radia (Mic Click)
  function playRadioClick(freqHz = 800) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqHz, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    } catch(e){}
  }

  // Inicjalizacja połączenia PeerJS na wybranym kanale
  async function initRadio() {
    const channel = freqInput.value.trim();
    if (!channel) return alert("Wpisz numer częstotliwości!");

    status.innerText = "ICHLADZANIE POLACZENIA...";

    try {
      // Pobieramy dostęp do mikrofonu (początkowo wyciszony)
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      // Wyciszamy mikrofon na start (aktywuje go tylko PTT)
      localStream.getAudioTracks()[0].enabled = false;

      // Unikalny ID dla danego pokoju radiowego
      const radioPeerId = "cometjet-vhf-channel-" + channel;

      // Próba rejestracji jako "Główny Odbiornik/Nadajnik" na danej częstotliwości
      peer = new Peer(radioPeerId);

      peer.on('open', (id) => {
        status.innerText = "STAN: OCZEKIWANIE NA DRUGIEGO PILOTA";
        status.style.color = "#33ff33";
        enablePTT();
      });

      // Jeśli ID jest zajęte = ktoś już jest na tej częstotliwości (drugi pilot)
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // Łączymy się do istniejącego pilota
          peer = new Peer(); 
          peer.on('open', () => {
            status.innerText = "STAN: POŁĄCZONO Z KANAŁEM " + channel;
            status.style.color = "#33ff33";
            
            // Nawiązujemy połączenie głosowe z pierwszym pilotem
            const call = peer.call(radioPeerId, localStream);
            handleCall(call);
            enablePTT();
          });
        } else {
          status.innerText = "BLAD POLACZENIA: " + err.type;
          status.style.color = "#ff3333";
        }
      });

      // Odbieranie nadchodzącego połączenia od drugiego pilota
      peer.on('call', (call) => {
        call.answer(localStream);
        handleCall(call);
      });

    } catch (err) {
      status.innerText = "BRAK DOSTĘPU DO MIKROFONU!";
      status.style.color = "#ff3333";
    }
  }

  function handleCall(call) {
    currentCall = call;
    call.on('stream', (remoteStream) => {
      // Odtwarzamy głos drugiego pilota
      remoteAudio.srcObject = remoteStream;
      status.innerText = "STAN: RADIO AKTYWNE (2 PILOTÓW)";
    });
  }

  function enablePTT() {
    pttBtn.disabled = false;
    freqInput.disabled = true;
    connectBtn.disabled = true;
  }

  // Rozpoczęcie nadawania (PTT Wciśnięte)
  function startTX() {
    if (isTransmitting || pttBtn.disabled) return;
    isTransmitting = true;
    
    // Włączamy mikrofon
    if (localStream) localStream.getAudioTracks()[0].enabled = true;
    
    playRadioClick(1000);
    status.innerText = "TX (NADAWANIE...)";
    status.style.color = "#ff3333";
    pttBtn.classList.add('active');
  }

  // Zakończenie nadawania (PTT Puszczone)
  function stopTX() {
    if (!isTransmitting) return;
    isTransmitting = false;
    
    // Wyciszamy mikrofon
    if (localStream) localStream.getAudioTracks()[0].enabled = false;
    
    playRadioClick(600);
    status.innerText = "STAN: RADIO AKTYWNE";
    status.style.color = "#33ff33";
    pttBtn.classList.remove('active');
  }

  // Eventy myszki
  pttBtn.addEventListener('mousedown', startTX);
  pttBtn.addEventListener('mouseup', stopTX);
  pttBtn.addEventListener('mouseleave', stopTX);

  // Eventy dotykowe (telefon/tablet)
  pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTX(); });
  pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTX(); });

  // Eventy klawiatury (Spacja)
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && !pttBtn.disabled) startTX();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') stopTX();
  });
</script>

</body>
</html>
