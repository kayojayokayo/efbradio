<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CometEFB - ATC & Charts</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #151821;
            --panel-border: #242938;
            --accent-color: #00d2ff;
            --accent-hover: #00a3cc;
            --text-main: #e1e6ed;
            --text-muted: #8c93a4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }

        .efb-container { display: flex; flex-direction: column; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; }
        .panel-header { font-size: 13px; font-weight: 700; color: var(--accent-color); text-transform: uppercase; margin-bottom: 12px; }

        .sb-fetch-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #0d0e12; border: 1px solid var(--panel-border); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent-color); }
        .btn { background-color: var(--accent-color); color: #000; font-weight: 600; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }

        .atc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
        .atc-section { background: rgba(0,0,0,0.2); border: 1px solid var(--panel-border); padding: 10px; border-radius: 6px; }
        .atc-section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        
        .atc-chip { background: #1c2230; border-left: 3px solid var(--accent-color); padding: 6px 10px; margin-bottom: 5px; border-radius: 3px; font-size: 12px; display: flex; justify-content: space-between; }
        .atc-chip .freq { color: var(--accent-color); font-weight: bold; }

        .chart-controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .chart-frame-container { width: 100%; height: 650px; border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; background: #151821; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="efb-container">

    <div class="panel">
        <div class="sb-fetch-group">
            <input type="text" id="sb-userid" placeholder="Numer ID SimBrief (np. 123456)">
            <button class="btn" onclick="fetchData()">Pobierz dane lotu</button>
        </div>
    </div>

    <!-- SEKCJA ATC VATSIM -->
    <div class="panel">
        <div class="panel-header">Aktywne ATC VATSIM na Trasie</div>
        <div class="atc-grid">
            <div class="atc-section">
                <div class="atc-section-title" id="title-dep">Odlot (DEP)</div>
                <div id="atc-dep-list" class="status-text">-</div>
            </div>
            <div class="atc-section">
                <div class="atc-section-title">Trasa (ENROUTE CTR)</div>
                <div id="atc-enroute-list" class="status-text">-</div>
            </div>
            <div class="atc-section">
                <div class="atc-section-title" id="title-arr">Przylot (ARR)</div>
                <div id="atc-arr-list" class="status-text">-</div>
            </div>
        </div>
    </div>

    <!-- SEKCJA KART -->
    <div class="panel">
        <div class="panel-header">Karty Lotnicze (Podgląd)</div>
        <div class="chart-controls">
            <button class="btn" onclick="loadChart('dep')">Karty Odlotu</button>
            <button class="btn" onclick="loadChart('arr')">Karty Przylotu</button>
        </div>
        <div class="chart-frame-container">
            <iframe id="chart-viewer" src="about:blank"></iframe>
        </div>
    </div>

</div>

<script>
    let flightData = { dep: '', arr: '', route: '', firList: [] };

    window.addEventListener('DOMContentLoaded', () => {
        const savedId = localStorage.getItem('simbrief_userid');
        if (savedId) {
            document.getElementById('sb-userid').value = savedId;
            fetchData();
        }
    });

    function fetchData() {
        const userId = document.getElementById('sb-userid').value.trim();
        if (!userId) return;

        localStorage.setItem('simbrief_userid', userId);

        fetch(`https://www.simbrief.com/api/xml.fetcher.php?userid=${userId}&json=v2`)
            .then(res => res.json())
            .then(data => {
                if (data.fetch && data.fetch.status === 'error') return;

                flightData.dep = data.origin?.icao_code || '';
                flightData.arr = data.destination?.icao_code || '';
                flightData.route = data.general?.route || '';

                extractFIRsFromRoute(data);

                document.getElementById('title-dep').innerText = `Odlot (${flightData.dep})`;
                document.getElementById('title-arr').innerText = `Przylot (${flightData.arr})`;

                loadChart('dep');
                fetchVatsimATC();
            })
            .catch(err => console.error(err));
    }

    function extractFIRsFromRoute(data) {
        const firs = new Set();
        if (flightData.dep) firs.add(flightData.dep.substring(0, 2));
        if (flightData.arr) firs.add(flightData.arr.substring(0, 2));

        if (data.navlog && data.navlog.fix) {
            data.navlog.fix.forEach(fix => {
                if (fix.fir_icao) {
                    firs.add(fix.fir_icao.substring(0, 2));
                    firs.add(fix.fir_icao);
                }
            });
        }
        flightData.firList = Array.from(firs);
    }

    function loadChart(type) {
        const icao = type === 'dep' ? flightData.dep : flightData.arr;
        const viewer = document.getElementById('chart-viewer');

        if (!icao) return;

        // Wykorzystanie otwartego portalu kart bez blokady X-Frame-Options
        viewer.src = `https://metar-taf.com/charts/${icao}`;
    }

    async function fetchVatsimATC() {
        if (!flightData.dep || !flightData.arr) return;

        try {
            const res = await fetch('https://data.vatsim.net/v3/vatsim-data.json');
            const data = await res.json();

            const dep = flightData.dep;
            const arr = flightData.arr;

            const depATC = [];
            const arrATC = [];
            const enrouteATC = [];

            data.controllers.forEach(c => {
                if (!c.callsign || c.callsign.endsWith('_ATIS')) return;

                if (c.callsign.startsWith(dep)) {
                    depATC.push(c);
                } 
                else if (c.callsign.startsWith(arr)) {
                    arrATC.push(c);
                } 
                else if (c.callsign.endsWith('_CTR') || c.callsign.endsWith('_FSS')) {
                    const callsignPrefix = c.callsign.substring(0, 2);
                    const callsignFir = c.callsign.split('_')[0];
                    
                    if (flightData.firList.includes(callsignPrefix) || flightData.firList.includes(callsignFir)) {
                        enrouteATC.push(c);
                    }
                }
            });

            renderGroup('atc-dep-list', depATC);
            renderGroup('atc-arr-list', arrATC);
            renderGroup('atc-enroute-list', enrouteATC);

        } catch (err) {
            console.error('Błąd VATSIM ATC:', err);
        }
    }

    function renderGroup(elementId, controllers) {
        const container = document.getElementById(elementId);
        if (!controllers.length) {
            container.innerHTML = '<span style="font-size:12px; color:#8c93a4;">Brak aktywnej pozycji</span>';
            return;
        }

        container.innerHTML = controllers.map(c => `
            <div class="atc-chip">
                <span>${c.callsign}</span>
                <span class="freq">${c.frequency}</span>
            </div>
        `).join('');
    }
</script>

</body>
</html>
