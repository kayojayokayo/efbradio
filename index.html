<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CometJet EFB P2P Live Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --accent: #fbc02d;
            --accent-dark: #f57f17;
            --bg-main: #050505;
            --bg-card: #111111;
            --bg-card-alt: #141414;
            --border: #222222;
            --border-light: #333333;
            --text: #ffffff;
            --text-dim: #666666;
            --danger: #e53935;
            --success: #4caf50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .efb-radio-widget {
            width: 330px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .radio-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .radio-title { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; }

        .pilots-online-pill {
            background-color: var(--bg-card-alt); border: 1px solid var(--border-light);
            border-radius: 20px; padding: 3px 10px; font-size: 10px; font-weight: 800; color: var(--accent);
            display: flex; align-items: center; gap: 6px;
        }
        .status-dot { width: 6px; height: 6px; background-color: var(--success); border-radius: 50%; }

        .peer-info-box { background: var(--bg-card-alt); border: 1px solid var(--border-light); padding: 10px; border-radius: 8px; font-size: 11px; }
        .peer-id-text { color: var(--accent); font-weight: 800; font-family: monospace; }

        .join-box { display: flex; gap: 6px; }
        .join-input {
            flex: 1; background: #000; border: 1px solid var(--border-light); color: #fff;
            padding: 6px 10px; border-radius: 6px; font-size: 11px; font-family: monospace;
        }
        .connect-btn {
            background: rgba(76, 175, 80, 0.2); border: 1px solid var(--success); color: var(--success);
            padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer;
        }

        .ptt-button {
            width: 100%; height: 50px; background: var(--bg-card-alt);
            border: 2px solid var(--accent); border-radius: 8px; color: var(--accent);
            font-weight: 900; letter-spacing: 2px; cursor: pointer;
        }
        .ptt-button:active, .ptt-button.active { background: var(--accent); color: #000; }
    </style>
</head>
<body>

    <div class="efb-radio-widget">
        <div class="radio-header">
            <span class="radio-title">📻 RADIO P2P</span>
            <div class="pilots-online-pill">
                <span class="status-dot"></span>
                <span id="pilotsCount">1 NA CZĘSTOTLIWOŚCI</span>
            </div>
        </div>

        <div class="peer-info-box">
            <span>TWÓJ KOD RADIA: </span>
            <span class="peer-id-text" id="myPeerId">GENEROWANIE...</span>
        </div>

        <div class="join-box">
            <input type="text" id="targetPeerId" class="join-input" placeholder="Wpisz kod drugiego radia...">
            <button class="connect-btn" onclick="connectToPeer()">POŁĄCZ</button>
        </div>

        <button class="ptt-button" id="pttBtn" onmousedown="startTx()" onmouseup="stopTx()" ontouchstart="startTx()" ontouchend="stopTx()">
            PUSH TO TALK
        </button>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let activeCalls = [];
        let connectedPeersCount = 1;

        // Audio Context do odbierania i nakładania filtra radiowego na głos INNYCH
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function createRadioFilter(stream) {
            const source = audioCtx.createMediaStreamSource(stream);
            
            const highpass = audioCtx.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 400;

            const lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 2800;

            source.connect(highpass);
            highpass.connect(lowpass);
            lowpass.connect(audioCtx.destination);
        }

        // Inicjalizacja P2P
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            localStream = stream;
            // Wyłączamy domyślnie mikrofon (wyciszenie PTT)
            localStream.getAudioTracks()[0].enabled = false;

            peer = new Peer();

            peer.on('open', id => {
                document.getElementById('myPeerId').textContent = id;
            });

            // Odbieranie połączenia od innego gracza
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    createRadioFilter(remoteStream);
                });
                updateCount(1);
            });
        });

        function connectToPeer() {
            const targetId = document.getElementById('targetPeerId').value.trim();
            if (!targetId || !peer) return;

            const call = peer.call(targetId, localStream);
            call.on('stream', remoteStream => {
                createRadioFilter(remoteStream);
            });
            updateCount(1);
        }

        function startTx() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (localStream) {
                localStream.getAudioTracks()[0].enabled = true; // Włącz mikrofon (wysyła na żywo)
                document.getElementById('pttBtn').classList.add('active');
            }
        }

        function stopTx() {
            if (localStream) {
                localStream.getAudioTracks()[0].enabled = false; // Wycisz mikrofon
                document.getElementById('pttBtn').classList.remove('active');
            }
        }

        function updateCount(delta) {
            connectedPeersCount += delta;
            document.getElementById('pilotsCount').textContent = `${connectedPeersCount} NA CZĘSTOTLIWOŚCI`;
        }
    </script>
</body>
</html>
