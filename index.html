<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CometJet EFB Live Radio Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #fbc02d;
            --accent-dark: #f57f17;
            --bg-main: #050505;
            --bg-card: #111111;
            --bg-card-alt: #141414;
            --border: #222222;
            --border-light: #333333;
            --text: #ffffff;
            --text-muted: #888888;
            --text-dim: #666666;
            --danger: #e53935;
            --success: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .efb-radio-widget {
            width: 320px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .radio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .radio-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-icon {
            color: var(--accent);
            font-size: 16px;
        }

        .radio-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .pilots-online-pill {
            background-color: var(--bg-card-alt);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pilots-online-pill .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--success);
        }

        .freq-display-card {
            background-color: var(--bg-card-alt);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .freq-info {
            display: flex;
            flex-direction: column;
        }

        .freq-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .freq-status {
            font-size: 11px;
            font-weight: 800;
            color: var(--success);
            text-transform: uppercase;
            margin-top: 2px;
        }

        .freq-status.disconnected {
            color: var(--text-dim);
        }

        .disconnect-btn {
            background-color: rgba(229, 57, 53, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }

        .disconnect-btn.connect-state {
            background-color: rgba(76, 175, 80, 0.15);
            border-color: var(--success);
            color: var(--success);
        }

        .ptt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .ptt-button {
            width: 100%;
            height: 52px;
            background: linear-gradient(180deg, var(--bg-card-alt) 0%, #08080a 100%);
            border: 2px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .ptt-button:active:not(:disabled), .ptt-button.active {
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: #000000;
        }

        .ptt-button:disabled {
            opacity: 0.35;
            border-color: var(--border-light);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .ptt-hint {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .tx-indicator {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 12px;
        }

        .tx-bar {
            width: 3px;
            height: 100%;
            background-color: currentColor;
            border-radius: 2px;
            animation: txPulse 0.6s infinite ease-in-out alternate;
        }

        .tx-bar:nth-child(1) { animation-delay: 0.1s; }
        .tx-bar:nth-child(2) { animation-delay: 0.3s; }
        .tx-bar:nth-child(3) { animation-delay: 0.2s; }

        @keyframes txPulse {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }
    </style>
</head>
<body>

    <div class="efb-radio-widget">
        <div class="radio-header">
            <div class="radio-title-group">
                <span class="radio-icon">📻</span>
                <span class="radio-title">RADIO COMM</span>
            </div>
            <div class="pilots-online-pill">
                <span class="status-dot"></span>
                <span id="pilotsCount">0 ONLINE</span>
            </div>
        </div>

        <div class="freq-display-card">
            <div class="freq-info">
                <span class="freq-label">CHANNEL STATUS</span>
                <span class="freq-status" id="channelStatus">CONNECTING...</span>
            </div>
            <button class="disconnect-btn" id="toggleConnectBtn" onclick="toggleConnection()">DISCONNECT</button>
        </div>

        <div class="ptt-container">
            <button class="ptt-button" id="pttBtn" disabled>
                <div class="tx-indicator" style="display: none;" id="txAnim">
                    <div class="tx-bar"></div>
                    <div class="tx-bar"></div>
                    <div class="tx-bar"></div>
                </div>
                <span id="pttText">PUSH TO TALK</span>
            </button>
            <span class="ptt-hint">HOLD SPACEBAR OR TAP TO TRANSMIT</span>
        </div>
    </div>

    <script>
        // WebSocket & Audio State
        const SERVER_URL = "ws://localhost:8080"; // Zmień na swój adres IP / domeny serwera
        let ws = null;
        let isConnected = false;
        let isTransmitting = false;

        let audioCtx = null;
        let mediaStream = null;
        let mediaRecorder = null;

        // Audio Filter Nodes for incoming voices
        let radioFilterHead = null;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                // Build Radio Audio Pipeline for Incoming Voice (VHF Filter + Distortion)
                const highpass = audioCtx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 400;

                const lowpass = audioCtx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.value = 2800;

                const distortion = audioCtx.createWaveShaper();
                distortion.curve = makeDistortionCurve(15);

                highpass.connect(lowpass);
                lowpass.connect(distortion);
                distortion.connect(audioCtx.destination);

                radioFilterHead = highpass;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function makeDistortionCurve(amount = 15) {
            const k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180;
            for (let i = 0; i < n; ++i) {
                const x = (i * 2) / n - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function connectWebSocket() {
            ws = new WebSocket(SERVER_URL);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                isConnected = true;
                updateStatusUI(true);
            };

            ws.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    const data = JSON.parse(event.data);
                    if (data.type === 'COUNT_UPDATE') {
                        document.getElementById('pilotsCount').textContent = `${data.count} ONLINE`;
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    // Play incoming audio stream from other pilots
                    playIncomingAudio(event.data);
                }
            };

            ws.onclose = () => {
                isConnected = false;
                updateStatusUI(false);
            };

            ws.onerror = (err) => {
                console.error("WS Error:", err);
                isConnected = false;
                updateStatusUI(false);
            };
        }

        async function playIncomingAudio(arrayBuffer) {
            initAudioContext();
            try {
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                // Przepuszczamy głos INNYCH przez filtr radiowy do głośników
                source.connect(radioFilterHead);
                source.start();
            } catch (e) {
                // Fragment audio w trakcie dekodowania
            }
        }

        async function startTransmission() {
            if (!isConnected || isTransmitting) return;
            initAudioContext();

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                    video: false
                });

                isTransmitting = true;
                updatePTTUI(true);

                // Streamowanie głosu do WebSocket w małych paczkach (brak odsłuchu samego siebie)
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm;codecs=opus' });
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
                        e.data.arrayBuffer().then(buffer => ws.send(buffer));
                    }
                };
                mediaRecorder.start(100); // Wysyłaj pakiet co 100ms

            } catch (err) {
                console.error("Mic error:", err);
                stopTransmission();
            }
        }

        function stopTransmission() {
            if (!isTransmitting) return;
            isTransmitting = false;
            updatePTTUI(false);

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
        }

        function updateStatusUI(connected) {
            const statusEl = document.getElementById('channelStatus');
            const btnEl = document.getElementById('toggleConnectBtn');
            const pttBtn = document.getElementById('pttBtn');

            if (connected) {
                statusEl.textContent = 'CONNECTED';
                statusEl.classList.remove('disconnected');
                btnEl.textContent = 'DISCONNECT';
                btnEl.classList.remove('connect-state');
                pttBtn.disabled = false;
            } else {
                statusEl.textContent = 'DISCONNECTED';
                statusEl.classList.add('disconnected');
                btnEl.textContent = 'CONNECT';
                btnEl.classList.add('connect-state');
                pttBtn.disabled = true;
                document.getElementById('pilotsCount').textContent = `0 ONLINE`;
            }
        }

        function toggleConnection() {
            if (isConnected) {
                if (ws) ws.close();
            } else {
                connectWebSocket();
            }
        }

        function updatePTTUI(active) {
            const btn = document.getElementById('pttBtn');
            const txt = document.getElementById('pttText');
            const anim = document.getElementById('txAnim');

            if (active) {
                btn.classList.add('active');
                txt.textContent = 'TRANSMITTING...';
                anim.style.display = 'flex';
            } else {
                btn.classList.remove('active');
                txt.textContent = 'PUSH TO TALK';
                anim.style.display = 'none';
            }
        }

        const pttBtn = document.getElementById('pttBtn');
        pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTransmission(); });
        window.addEventListener('mouseup', () => { if (isTransmitting) stopTransmission(); });
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmission(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmission(); });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                startTransmission();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                stopTransmission();
            }
        });

        // Auto-connect on startup
        connectWebSocket();
    </script>
</body>
</html>
